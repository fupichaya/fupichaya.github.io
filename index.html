<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็กร่างกาย 5 นาที กับโค้ชฟูจิ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single-column check-up "chart" — ECG-grid hero, step lanes, results printed like a lab report. */
:root{
  --paper:#edf3ef;
  --card:#ffffff;
  --ink:#10261c;
  --muted:#557063;
  --line:#cfdcd4;
  --accent:#0e8a5a;
  --on-accent:#ffffff;
  --accent-soft:#dcf2e6;
  --grid:rgba(14,138,90,.11);
  --good:#2f9e6a; --warn:#c98a10; --bad:#c9342d;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a1510; --card:#11221a; --ink:#e4f1ea; --muted:#8fb0a0; --line:#20382c;
    --accent:#3fd18f; --on-accent:#05251a; --accent-soft:#143a2a; --grid:rgba(63,209,143,.09);
    --good:#3fbf86; --warn:#e5b13a; --bad:#ff6b63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a1510; --card:#11221a; --ink:#e4f1ea; --muted:#8fb0a0; --line:#20382c;
  --accent:#3fd18f; --on-accent:#05251a; --accent-soft:#143a2a; --grid:rgba(63,209,143,.09);
  --good:#3fbf86; --warn:#e5b13a; --bad:#ff6b63; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Hero: ECG strip */
.strip{position:relative;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;padding:22px 20px 20px}
.strip .tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.strip h1{font-size:clamp(30px,8vw,44px);font-weight:700;margin-top:6px}
.strip h1 em{font-style:normal;color:var(--accent)}
.strip .lead{color:var(--muted);margin-top:8px;max-width:34em}
.ecg{display:block;width:100%;height:56px;margin:14px 0 4px}
.ecg path{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:0;animation:trace 2.6s ease-out 1}
@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.ecg path{animation:none}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:22px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:4px}

.btn{appearance:none;border:0;border-radius:10px;padding:14px 18px;font:600 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}

.steps-list{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin-top:14px;font-size:15px}
.steps-list .n{font-family:var(--mono);color:var(--accent);font-weight:600}

/* Sample result */
.sample{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:12px}
@media (max-width:420px){.sample{grid-template-columns:1fr}.sample svg{max-width:200px;margin:0 auto}}
.example-badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;display:inline-block}

/* Progress lanes */
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lane{height:6px;border-radius:3px;background:var(--line)}
.lane.on{background:var(--accent)}
.lane-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}

/* Questions */
.q{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:6px}
.q label.ql,.q .ql{font-weight:600}
.q .opt-note{font-weight:400;color:var(--muted);font-size:14px}
.how{font-size:14px;color:var(--muted);background:var(--paper);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 15px var(--body);cursor:pointer;min-height:46px;line-height:1.35}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=number],input[type=text]{font:500 18px var(--mono);width:140px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
input[type=text]{font-family:var(--body);width:100%;max-width:260px}
.unit{color:var(--muted)}
.skip{font-size:14px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px 0;font-family:var(--body)}
.skipped{font-size:14px;color:var(--muted)}
.yn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.yn:last-child{border-bottom:0}
.yn .pair{display:flex;gap:6px}
.yn .opt{min-width:64px;text-align:center;padding:8px 10px;min-height:40px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.alert{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:10px;padding:12px 14px;font-size:14px}

.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;transition:padding .2s}
.timer .clock{font:600 26px var(--mono);min-width:72px;font-variant-numeric:tabular-nums}
.timer .btn{min-height:40px;padding:8px 14px;font-size:14px}
.timer.running{flex-direction:column;align-items:stretch;gap:12px;padding:16px;border:2px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.timer.running .clock{font-size:64px;line-height:1;text-align:center}
.timer.running .btn{min-height:76px;font-size:22px;background:var(--accent);color:var(--on-accent);border:0}
.demo{display:flex;justify-content:center;background:var(--paper);border-radius:10px;padding:6px}
.demo canvas{width:100%;max-width:300px;aspect-ratio:200/140;display:block}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:0 14px;min-height:46px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* Results */
.report-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.score-big{font:700 64px/1 var(--display);color:var(--accent)}
.score-big small{font-size:20px;color:var(--muted);font-weight:600}
.level{display:inline-block;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;color:#fff;margin-top:6px}
.pcard{max-width:330px;margin:14px auto 0}
.linkbox{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.linkbox .lb-k{font-size:13px;color:var(--muted)}
.linkbox .lb-url{font-family:var(--mono);font-size:17px;font-weight:600;margin:4px 0 10px;user-select:all;-webkit-user-select:all;word-break:break-all}
.linkbox .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbox .btn{font-size:14px;padding:12px 8px}
.igsteps{margin-top:14px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.6}
.igsteps ol{margin:8px 0 12px 18px;padding:0}
.igsteps .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.igsteps .row2 .btn{font-size:14px;padding:12px 8px}
.pcard svg{width:100%;height:auto;display:block}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes mbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
@keyframes mfloat{0%{opacity:0;transform:translateY(4px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes mspin{to{transform:rotate(360deg)}}
@keyframes mtw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
@keyframes mflame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3)}}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pcard .m-pulse{animation:mpulse 1.2s infinite}
.pcard .m-beat{transform-box:fill-box;transform-origin:center;animation:mbeat 1.1s infinite}
.pcard .m-float{animation:mfloat 2s infinite}
.pcard .m-spin{transform-box:fill-box;transform-origin:center;animation:mspin 3s linear infinite}
.pcard .m-tw{transform-box:fill-box;transform-origin:center;animation:mtw 1.6s infinite}
.pcard .m-flame{transform-box:fill-box;transform-origin:top center;animation:mflame .35s infinite}
.pcard .m-bob{animation:mbob 1.4s ease-in-out infinite}
@keyframes mpoke{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
@keyframes mflapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes mflapR{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes mslow{0%,100%{transform:scale(1)}10%{transform:scale(1.12)}20%{transform:scale(1)}}
.pcard .m-poke{animation:mpoke 1.5s ease-in-out infinite}
.pcard .m-flapL{transform-box:fill-box;transform-origin:right bottom;animation:mflapL 1s ease-in-out infinite}
.pcard .m-flapR{transform-box:fill-box;transform-origin:left bottom;animation:mflapR 1s ease-in-out infinite}
.pcard .m-slowbeat{transform-box:fill-box;transform-origin:center;animation:mslow 2s infinite}
@media (prefers-reduced-motion:reduce){.pcard *{animation:none!important}}
.archetype{border:1.5px solid var(--ink);border-radius:12px;padding:16px;margin-top:16px;position:relative}
.archetype .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.archetype h3{font-size:26px;margin-top:2px}
.domains{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.dom{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.dom .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.dom .bar i{display:block;height:100%;border-radius:4px}
.dom .meta{font-size:13px;color:var(--muted);grid-column:1/-1}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.radar-box{display:flex;justify-content:center;margin:10px 0}
.radar-box svg{width:100%;max-width:300px;height:auto}
.cmps{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.cmp{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.cmp:last-child{border-bottom:0;padding-bottom:0}
.cmp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp-val .num{font-size:22px;font-weight:600}
.cmp .meta,.card > .meta{font-size:13px;color:var(--muted)}
.pbar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 45%,transparent),color-mix(in srgb,var(--warn) 45%,transparent) 40%,color-mix(in srgb,var(--good) 55%,transparent));margin:4px 0}
.pbar span{position:absolute;top:0;bottom:0;width:1px;background:var(--card)}
.pbar i{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--card)}
.lb-form{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px dashed var(--line);border-radius:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.lb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.lb-pick{display:flex;gap:6px}
.lb-sel{font:500 14px var(--body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:40px}
.lb-me{font-size:16px;margin-bottom:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.lb-me b{font-size:22px;color:var(--accent)}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb-list li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.lb-list li.me{border:2px solid var(--accent);background:var(--accent-soft)}
.lb-list .rk{font-weight:600;font-size:18px;color:var(--muted);text-align:center}
.lb-list li:nth-child(-n+3) .rk{color:var(--accent)}
.lb-list .nm{font-weight:600;overflow-wrap:anywhere}
.lb-list .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lb-list .sc{font-size:20px;font-weight:600}
.week{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.day{display:block;padding:0;border:1px solid var(--line);border-radius:10px}
.day summary{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:10px 12px;cursor:pointer;list-style:none}
.day summary::-webkit-details-marker{display:none}
.day summary::after{content:"+";font:600 20px var(--mono);color:var(--muted);line-height:1}
.day[open] summary::after{content:"–"}
.day summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.day .d{font:700 18px var(--display);color:var(--accent);text-align:center;padding-top:2px}
.ex{padding:0 12px 12px 68px;display:flex;flex-direction:column;gap:6px;font-size:15px}
@media (max-width:420px){.ex{padding-left:14px}}
.ex ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ex li span{display:block;color:var(--ink);font-size:15px}
.ex li.has-anim{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;cursor:zoom-in}
.ex li canvas{width:96px;aspect-ratio:200/140;background:var(--paper);border-radius:8px;display:block}
.ex li.big{grid-template-columns:1fr;cursor:zoom-out}
.ex li.big canvas{width:100%;max-width:320px}
.ex li b{display:block;font:600 13px var(--mono);color:var(--accent)}
.ex-warm,.ex-note{font-size:13px;color:var(--muted)}
.why,.missions{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.why ul.clean,.missions ul.clean{margin-top:6px;gap:4px}
.extra{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.extra > b{font-size:13px;color:var(--accent)}
.ex li small{display:block;font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}
.ex li small.exlad{color:var(--ink);opacity:.8}
.ex li small.exlad i{font-style:normal;color:var(--accent);font-weight:600}
.day b{display:block}
.day span{font-size:14px;color:var(--muted)}
ul.gate{margin:0;padding:12px 14px 12px 30px;background:var(--paper);border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
ul.clean{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn-ig{background:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);color:#fff;border:0;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn-ig:hover{filter:brightness(1.06)}
.coach .btn-primary{background:var(--accent);color:var(--on-accent)}
.coach{background:var(--ink);color:var(--paper);border-radius:14px;padding:20px;border:0}
.coach .sub{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.coach h2{color:var(--paper)}
.coach .btn-ghost{color:var(--paper);border-color:color-mix(in srgb,var(--paper) 40%,transparent)}
.toast{font-size:14px;color:var(--good);font-weight:600;min-height:20px}
.fine{font-size:12px;color:var(--muted);text-align:center}
textarea.copybox{width:100%;min-height:140px;font:13px var(--mono);border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px;display:none}
.sound{position:fixed;right:12px;bottom:12px;z-index:5;appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);min-height:40px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sound[aria-pressed="false"]{color:var(--muted)}
@media print{.noprint{display:none!important}}
</style>
</head>

<script>
/* ---------- ตั้งค่าช่องทางติดต่อโค้ช (ใส่ได้ภายหลัง) ---------- */
const COACH = { name: "โค้ชฟูจิ", line: "fupichaya", ig: "fupichaya" };
/* ---------- ตารางอันดับ: ใส่ลิงก์ Web app ของ Google Apps Script ---------- */
const LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbyfBQHT2PRRuw0yHqSRmsIu3pETXiItUS9IWeo9HXWzUYMvbrptyAG6BiAYLjC9VB1qbA/exec";

/* ---------- คำถาม ---------- */
const STEPS = [
 {id:"basic", title:"ข้อมูลพื้นฐาน", sub:"ขอข้อมูลนิดนึง จะได้เทียบกับคนเพศเดียวกันวัยเดียวกันได้ถูก", qs:[
  {id:"name", type:"text", label:"ชื่อเล่น", ph:"เช่น บีม", optional:true, note:"จะขึ้นในตารางอันดับ ไม่ใส่ก็ได้ ระบบตั้งชื่อให้"},
  {id:"sex", type:"choice", label:"เพศ", opts:[["m","ชาย"],["f","หญิง"]]},
  {id:"age", type:"num", label:"อายุ", unit:"ปี", min:12, max:90},

/* ---------- state ---------- */
let S = { view:"start", step:0, a:{}, skipped:{}, err:"" };
function save(){ try{ localStorage.setItem("fuji-check", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem("fuji-check"); if(r){ const o = JSON.parse(r); if(o && o.a) S = Object.assign(S, o, {err:""}); } }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- scoring ---------- */
function bandUp(v, t){ let s = 20; t.forEach(x => { if(v >= x) s += 20; }); return s; }
function bandDown(v, t){ let s = 100; t.forEach(x => { if(v >= x) s -= 20; }); return s; }
function avg(arr){ const v = arr.filter(x => x != null && !isNaN(x)); return v.length ? Math.round(v.reduce((p,c)=>p+c,0)/v.length) : null; }
function unitOf(id){ return S.a[id+"Unit"] === "in" ? "in" : "cm"; }
function rng(q){ return q.units && unitOf(q.id) !== "cm" ? Object.assign({}, q, q.units[unitOf(q.id)], {unit:q.units[unitOf(q.id)].label}) : q; }
function n(k){ const v = S.a[k]; if(v === undefined || v === "" || S.skipped[k]) return null; const x = Number(v); return isNaN(x) ? null : x; }
function nn(v, d){ return v === undefined || v === null ? d : v; }
function c(k){ return S.skipped[k] ? null : nn(S.a[k], null); }

/* ---------- เกณฑ์ตามช่วงอายุ ----------
   ลุกนั่ง 1 นาที: Strassmann et al. 2013, Int J Public Health 58:949-953 (เปอร์เซ็นไทล์ 2.5/25/50/75/97.5)
   วิดพื้น: CSEP-PATH (ชาย = เต็มตัว, หญิง = วางเข่า) เกณฑ์ขั้นต่ำของ พอใช้/ดี/ดีมาก/ดีเยี่ยม
   ชีพจรขณะพัก: ตารางอ้างอิงที่ใช้ทั่วไป (ขอบบนของแต่ละระดับ) */
const STS = {
  m:[[20,27,41,50,57,72],[25,29,40,48,56,74],[30,28,40,47,56,72],[35,27,38,47,58,72],[40,25,37,45,53,69],[45,25,35,44,52,70],[50,24,35,42,53,67],[55,22,33,41,48,63],[60,20,31,37,46,63],[65,20,29,35,44,60],[70,19,27,32,40,59],[75,16,25,30,37,56]],
  f:[[20,31,39,47,55,70],[25,30,40,47,54,68],[30,27,37,45,51,68],[35,25,37,42,50,63],[40,26,35,41,48,65],[45,25,35,41,50,63],[50,23,33,39,47,60],[55,21,30,36,43,61],[60,20,28,34,40,55],[65,19,27,33,40,53],[70,17,25,30,36,51],[75,13,22,27,30,43]]
};
const PUSHN = {
  m:[[15,18,23,29,39],[20,17,22,29,36],[30,12,17,22,30],[40,10,13,17,25],[50,7,10,13,21],[60,5,8,11,18]],
  f:[[15,12,18,25,33],[20,10,15,21,30],[30,8,13,20,27],[40,5,11,15,24],[50,2,7,11,21],[60,2,5,12,17]]
};
const PUSH_HI = {15:19,20:29,30:39,40:49,50:59,60:69};
const PUSH_LV = ["ควรพัฒนา","พอใช้","ดี","ดีมาก","ดีเยี่ยม"];
const RHRN = {
  m:[[18,25,55,61,65,69,73,81],[26,35,54,61,65,70,74,81],[36,45,56,62,66,70,75,82],[46,55,57,63,67,71,76,83],[56,65,56,61,67,71,75,81],[66,null,55,61,65,69,73,79]],
  f:[[18,25,60,65,69,73,78,84],[26,35,59,64,68,72,76,82],[36,45,59,64,69,73,78,84],[46,55,60,65,69,73,77,83],[56,65,59,64,68,73,77,83],[66,null,59,64,68,72,76,84]]
};
const RHR_LV = ["ระดับนักกีฬา","ดีเยี่ยม","ดี","ดีกว่าค่าเฉลี่ย","ค่าเฉลี่ย","ต่ำกว่าค่าเฉลี่ย","ควรปรับปรุง"];
const sexTh = () => S.a.sex === "f" ? "ผู้หญิง" : "ผู้ชาย";
function pickRow(rows, age){ let r = rows[0]; rows.forEach(x => { if(age >= x[0]) r = x; }); return r; }
function stsNorm(v, age, sex){
  const row = pickRow(STS[sex], age), pts = row.slice(1), pc = [2.5,25,50,75,97.5];
  let pct;
  if(v <= pts[0]) pct = 2; else if(v >= pts[4]) pct = 98;
  else { for(let i = 0; i < 4; i++){ if(v <= pts[i+1]){ pct = pc[i] + (pc[i+1]-pc[i]) * (v-pts[i]) / Math.max(1, pts[i+1]-pts[i]); break; } } }
  pct = Math.round(pct);
  const lv = pct >= 75 ? "กลุ่มท็อป 25%" : pct >= 50 ? "สูงกว่าค่ากลาง" : pct >= 25 ? "ต่ำกว่าค่ากลาง" : "ต่ำกว่าเกณฑ์";
  const next = v < pts[1] ? {t:"ให้พ้นกลุ่ม 25% ล่างสุด", n:pts[1]} : v < pts[2] ? {t:"ถึงค่ากลาง", n:pts[2]} : v < pts[3] ? {t:"เข้ากลุ่มท็อป 25%", n:pts[3]} : null;
  const edge = age < 20 ? " (ใช้เกณฑ์ 20–24 ปี)" : age > 79 ? " (ใช้เกณฑ์ 75–79 ปี)" : "";
  return {pct, lv, med:pts[2], next, group:`${sexTh()} ${row[0]}–${row[0]+4} ปี${edge}`, score:Math.round(10 + pct*0.9)};
}
function pushNorm(v, style, age, sex){
  // เกณฑ์ CSEP: ชายใช้วิดพื้นเต็มตัว หญิงใช้แบบวางเข่า
  if(style === "wall" || (sex === "m" && style === "knee")) return null;
  const row = pickRow(PUSHN[sex], age), th = row.slice(1);
  let i = 0; th.forEach(x => { if(v >= x) i++; });
  const next = i < 4 ? {t:`ถึงระดับ “${PUSH_LV[i+1]}”`, n:th[i]} : null;
  const edge = age < 15 ? " (ใช้เกณฑ์ 15–19 ปี)" : age > 69 ? " (ใช้เกณฑ์ 60–69 ปี)" : "";
  const note = sex === "f" && style === "full" ? "เทียบกับเกณฑ์วางเข่า แต่คุณทำแบบเต็มตัวซึ่งยากกว่า ระดับจริงน่าจะสูงกว่านี้" : "";
  return {i, lv:PUSH_LV[i], next, note, group:`${sexTh()} ${row[0]}–${PUSH_HI[row[0]]} ปี${edge}`, score:[20,40,60,80,100][i]};
}
function rhrNorm(v, age, sex){
  const row = pickRow(RHRN[sex], age), ub = row.slice(2);
  let i = 0; while(i < ub.length && v > ub[i]) i++;
  const next = i >= 3 ? {t:`ถึงระดับ “${RHR_LV[i-1]}”`, n:ub[i-1], le:true} : null;
  const edge = age < 18 ? " (ใช้เกณฑ์ 18–25 ปี)" : "";
  return {i, lv:RHR_LV[i], next, group:`${sexTh()} ${row[1] ? `${row[0]}–${row[1]}` : `${row[0]} ปีขึ้นไป`}${row[1] ? " ปี" : ""}${edge}`, score:[100,90,80,70,55,40,25][i]};
}

function compute(){
  const a = S.a, age = n("age") || 30, female = a.sex === "f";
  // strength
  const sx = female ? "f" : "m";
  const sq = n("squat"), sqN = sq != null ? stsNorm(sq, age, sx) : null;
  let push = null, pushN = null;
  if(n("push") != null && c("pushStyle")){
    pushN = pushNorm(n("push"), c("pushStyle"), age, sx);
    if(pushN) push = pushN.score;
    else { const mult = {full:1, knee:0.5, wall:0.25}[c("pushStyle")]; push = bandUp(n("push") * mult, female ? [2,6,12,20] : [5,12,20,30]); }
  }
  const pl = n("plank");
  const strength = avg([sqN ? sqN.score : null, push, pl!=null?bandUp(pl,[20,45,75,120]):null]);
  // cardio
  const st = c("march"), rhr = n("rhr"), rhrN = rhr != null ? rhrNorm(rhr, age, sx) : null;
  const cardio = avg([st ? {1:20,2:45,3:70,4:95}[st] : null, rhrN ? rhrN.score : null,
                      a.move != null && (st || rhr!=null) ? {0:30,1:50,2:75,3:95}[a.move] : null]);
  // flexibility
  const flex = avg([c("toe") ? Number(c("toe"))*20 : null, c("reach") ? {1:30,2:55,3:80,4:100}[c("reach")] : null]);
  // body composition (Asian BMI cut-offs)
  const w = n("weight"), h = n("height"), wa = n("waist") != null ? n("waist") * (unitOf("waist") === "in" ? 2.54 : 1) : null;
  let bmi = null, bmiS = null, whr = null, whrS = null;
  if(w && h){ bmi = w / Math.pow(h/100, 2);
    bmiS = bmi < 18.5 ? 55 : bmi < 23 ? 95 : bmi < 25 ? 70 : bmi < 30 ? 45 : 25; }
  if(wa && h){ whr = wa / h; whrS = whr < 0.5 ? 95 : whr < 0.6 ? 55 : 25; }
  const body = avg([bmiS, whrS]);
  // lifestyle
  const life = avg([{a:30,b:65,c:100,d:70}[a.sleep], {1:100,2:85,3:65,4:40,5:20}[a.stress], {a:100,b:65,c:35}[a.sit],
                    {0:20,1:45,2:75,3:100}[a.move], {a:100,b:60,c:25}[a.protein]]);
  const dom = [
    {k:"strength", name:"ความแข็งแรง", s:strength},
    {k:"cardio", name:"หัวใจและปอด", s:cardio},
    {k:"flex", name:"ความยืดหยุ่น", s:flex},
    {k:"body", name:"องค์ประกอบร่างกาย", s:body},
    {k:"life", name:"ไลฟ์สไตล์", s:life}
  ];
  const overall = avg(dom.map(d => d.s));
  const parqYes = a.parqAny === "y" ? 1 : (a.parq || []).filter(x => x === "y").length;
  const pain = (a.pain || []).filter(x => x !== "none");
  return {dom, overall, bmi, whr, parqYes, pain, sqN, pushN, rhrN, sq, rhr};
}

function levelOf(s){
  if(s == null) return {t:"ยังไม่มีข้อมูล", col:"var(--muted)"};
  if(s >= 80) return {t:"ดีมาก", col:"var(--good)"};
  if(s >= 65) return {t:"ดี", col:"var(--good)"};
  if(s >= 50) return {t:"พอใช้", col:"var(--warn)"};
  if(s >= 35) return {t:"ควรพัฒนา", col:"var(--bad)"};
  return {t:"เริ่มจากตรงนี้", col:"var(--bad)"};

function archetype(r){
  const known = r.dom.filter(d => d.s != null), sc = {}; r.dom.forEach(d => sc[d.k] = d.s);
  if(!known.length) return ARCH.zero;
  if(known.length === 5 && known.every(d => d.s >= 85)) return ARCH.legend;
  const pl = n("plank");
  if(pl != null && pl >= 120) return ARCH.core;
  if(r.rhr && r.rhr >= 40 && r.rhr < 60 && !r.parqYes && sc.cardio != null && sc.cardio >= 70) return ARCH.cheetah;
  if(known.length >= 4 && known.every(d => d.s >= 75)) return ARCH.top;
  if(known.length >= 3 && known.every(d => d.s < 45)) return ARCH.zero;
  // คู่ตรงข้าม: เด่นด้านหนึ่ง แต่อีกด้านห่างกันชัด
  let best = null;
  [["tank","strength","cardio",65],["rabbit","cardio","strength",65],["noodle","flex","strength",70],["safe","strength","flex",65]].forEach(([k, hi, lo, min]) => {
    if(sc[hi] == null || sc[lo] == null) return;
    const g = sc[hi] - sc[lo];
    if(sc[hi] >= min && g >= 30 && (!best || g > best.g)) best = {k:k, g:g};
  });
  if(r.sqN && r.pushN){ const g = r.sqN.score - r.pushN.score; if(r.sqN.score >= 65 && g >= 35 && (!best || g > best.g)) best = {k:"kangaroo", g:g}; }
  if(best) return ARCH[best.k];
  // จุดอ่อนที่สุด แล้วดูพฤติกรรมเฉพาะ
  const weakest = known.slice().sort((x,y) => x.s - y.s)[0], reach = numC("reach");
  if((weakest.k === "flex" || weakest.k === "life") && S.a.sit === "c" && reach != null && reach <= 2) return ARCH.turtle;
  if(weakest.k === "life"){ if(S.a.sleep === "a") return ARCH.owl; if(Number(S.a.stress) >= 4) return ARCH.volcano; }
  return ARCH[weakest.k];
}

  // จัดตารางจาก "สิ่งที่แต่ละคนยังขาด" ก่อน แล้วค่อยเติมตามเป้าหมาย

  if(pl < 20) return it("เดดบั๊ก (Dead bug)", "deadbug", `${X.sets} เซต × 8 ครั้ง ข้างละ`,
    `แพลงก์ได้ ${pl} วิ ยังคุมแกนกลางในท่าคว่ำได้ไม่นาน เริ่มจากท่านอนหงายซึ่งหลังปลอดภัยกว่า`, "แพลงก์ ค้าง 15–20 วิ", null);
  if(pl < 45){ const h = r5(pl * 0.6); return it("แพลงก์", "plank", `${X.sets} เซต × ค้าง ${h} วิ`,
    `แพลงก์ได้ ${pl} วิ ตั้งไว้เซตละ ${h} วิ (ราว 60%) ให้ลำตัวตรงตลอด เป้าหมายคือ 45 วิ ซึ่งถือว่าแกนกลางพื้นฐานดี`, "เพิ่มทีละ 5 วิ จนถึง 45 วิ", "เดดบั๊ก (Dead bug)"); }
  if(pl < 90) return it("แพลงก์ด้านข้าง", "sideplank", `${X.sets} เซต × ค้าง ${r5(pl * 0.4)} วิ ข้างละ`,
    `แพลงก์ได้ ${pl} วิ แกนกลางด้านหน้าดีแล้ว เพิ่มด้านข้างซึ่งช่วยกันลำตัวเอียงและเข่าบิดเวลาลงน้ำหนักขาเดียว`, "แพลงก์แตะไหล่สลับ", "แพลงก์ด้านข้าง (วางเข่า)");
  return it("แพลงก์แตะไหล่สลับ", "plank_tap", `${X.sets} เซต × 10 ครั้ง ข้างละ`,
    `แพลงก์ได้ ${pl} วิ ค้างนานกว่านี้แทบไม่ได้ประโยชน์เพิ่ม เปลี่ยนเป็นท่าต้านการบิดตัวซึ่งยากกว่าและใช้กับชีวิตจริงได้มากกว่า`, "แตะไหล่ช้าลง 2 วิต่อครั้ง", "แพลงก์ด้านข้าง");
}
/* ท่าขาเดียว: ทรงตัว เก็บข้างที่อ่อนกว่า */
function pSingle(r, X){
  if(X.has("knee") || X.has("ankle")) return it("ยกสะโพกขาเดียว", "bridge1", `${X.sets} เซต × 10–12 ครั้ง ข้างละ`,
    `ฝึกขาทีละข้างโดยไม่ลงน้ำหนักที่${X.has("knee") ? "เข่า" : "ข้อเท้า"}ที่ปวด`, "ก้าวขึ้นลงขั้นบันได (ขั้นต่ำ) เมื่อไม่ปวด", "ยกสะโพก (Glute bridge)");
  const L = [["ก้าวขึ้นลงขั้นบันได (ขั้นต่ำ)","stepup"],["ก้าวขึ้นลงขั้นบันได","stepup"],["ก้าวถอยหลังย่อเข่า (Reverse lunge)","lunge"],["ก้าวถอยหลังย่อเข่า ถือดัมเบล","lunge"]];
  const lv = lvFrom(r.sqN ? r.sqN.score : r.dom[0].s, X), [up, down] = ladder(L, lv, "เพิ่มน้ำหนักดัมเบล");
  const why = X.age >= 60 ? "ในวัยนี้การฝึกขาทีละข้างช่วยเรื่องการทรงตัวและลดความเสี่ยงล้ม ตามคำแนะนำของ ACSM"
            : X.g === "sport" ? "กีฬาเกือบทุกชนิดลงน้ำหนักทีละขา ท่านี้ฝึกแรงและการทรงตัวแบบที่ใช้จริง"
            : "ขาสองข้างมักแรงไม่เท่ากัน ฝึกทีละข้างช่วยเก็บข้างที่อ่อนกว่า และใช้จริงตอนขึ้นบันได";
  return it(L[lv][0], L[lv][1], `${X.sets} เซต × ${X.P.reps} ครั้ง ข้างละ`, why, up, down);
}
/* ท่าดันเหนือหัว: ทำเมื่อยกแขนได้สุดเท่านั้น */
function pOver(r, X){
  const reach = numC("reach");
  if(X.has("shoulder") || X.has("neck") || (reach != null && reach <= 2)){
    const f = [reach != null && reach <= 2 ? "เอื้อมมือไขว้หลังไม่ถึงกัน" : null, X.has("shoulder") || X.has("neck") ? "ปวดคอบ่าไหล่" : null].filter(Boolean).join(" และ");
    return it("ยืนพิงกำแพงเลื่อนแขน (Wall slide)", "wallslide", `${X.sets} เซต × 10–12 ครั้ง`,
      `คุณ${f} แปลว่ายังยกแขนเหนือหัวได้ไม่สุด ถ้าดันน้ำหนักเหนือหัวตอนนี้ หลังจะแอ่นชดเชยและไหล่ถูกบีบ ฝึกให้ยกแขนได้สุดก่อน`,
      "ดันดัมเบลเหนือหัว เมื่อไขว้มือหลังแตะกันได้", null);
  }
  return it("ดันขวดน้ำหรือดัมเบลขึ้นเหนือหัว", "press", `${X.sets} เซต × ${X.P.reps} ครั้ง`,
    `${reach ? "ไหล่ยกได้สุดดี " : ""}ฝึกดันเหนือหัวขณะยืน สร้างไหล่และแกนกลางไปพร้อมกัน`, "เพิ่มน้ำหนักทีละ 1 กก.", "ยืนพิงกำแพงเลื่อนแขน (Wall slide)");
}
function pPullApart(r, X){
  const f = postureFlags(X);
  return it("กางแขนดึงยางยืด (Band pull-apart)", "pullapart", `${X.sets} เซต × 15 ครั้ง`,
    f.length ? `คุณ${f.join(" และ")} ท่านี้ฝึกกล้ามหลังไหล่และสะบักที่ช่วยดึงไหล่กลับ` : "ฝึกกล้ามหลังไหล่ให้สมดุลกับอกและไหล่หน้า",
    "ค้างตอนกางสุด 2 วิ", null);
}
function pCurl(r, X){
  return it("งอแขนยกดัมเบล (Biceps curl)", "curl", `${X.sets} เซต × ${X.P.reps} ครั้ง`, "เป้าหมายคือเพิ่มกล้าม เสริมต้นแขนหลังจากท่าหลักแล้ว", "ลงช้า 3 วิ", null);
}
function pCalf(r, X){

/* วันเวท: เลือกท่าตามลำดับความสำคัญของคนนั้น แล้วเรียงท่าใหญ่ก่อน */
function strengthDay(k, r){
  const X = rxCtx(r), mins = Number(S.a.mins || 45), N = mins <= 30 ? 4 : mins <= 45 ? 5 : 6;
  const pl = n("plank"), posture = postureFlags(X).length > 0, coreNeed = (pl != null && pl < 45) || X.has("back");
  let slots;
  if(k === "upper") slots = [[pPush,5],[pPull,posture ? 5.1 : 4.9],[pOver,4],[pPullApart,posture ? 4.5 : 2],[pCore,coreNeed ? 4.2 : 2.5],[pCurl,X.g === "muscle" ? 3 : 0]];
  else if(k === "lower") slots = [[pSquat,5],[pHinge,4.9],[pSingle,4.5],[pCore,coreNeed ? 4.2 : 3],[pCalf,X.has("ankle") ? 0 : 1.5]];
  else slots = [[pSquat,5],[pPush,4.8],[pHinge,4.6],[pPull,posture ? 4.9 : 4.7],[pSingle,X.age >= 60 || X.g === "sport" ? 4.5 : 3],[pCore,coreNeed ? 4.55 : 3.5]];
  const keep = slots.filter(s => s[1] > 0).sort((a,b) => b[1] - a[1]).slice(0, N).map(s => s[0]);
  const seen = new Set(), list = [];
  slots.forEach(s => { if(!keep.includes(s[0])) return; const e = s[0](r, X); if(seen.has(e.n)) return; seen.add(e.n); list.push(e); });
  const warm = ["หมุนข้อต่อ","เดินย่ำเท้า 1 นาที", X.has("knee") ? "ยกสะโพก 10 ครั้ง" : "สควอตตัวเปล่า 10 ครั้ง"];
  if(numC("toe") != null && numC("toe") <= 2) warm.push("เหวี่ยงขาหน้าหลัง");
  if(posture) warm.push("หมุนแขนวงใหญ่");
  const note = `จังหวะ: ${X.P.tempo} · ${X.P.rest} · ความหนัก: ${X.P.rpe} (${X.P.why})` +
    (X.g === "fat" ? " · ทำท่าแรกถึงท่าสุดท้ายต่อกันเป็น 1 รอบ แล้ววนใหม่" : "") +
    " · ทำครบทุกเซตได้สบาย 2 ครั้งติดกัน ค่อยขยับท่าหรือเพิ่มน้ำหนัก";
  return {warm:"วอร์มอัพ 5 นาที: " + warm.join(" "), list, note};
}

/* วันยืด/คอร์เรกทีฟ: เลือกจากจุดตึง จุดปวด และพฤติกรรมของคนนั้น */
function flexDay(k, r){
  const X = rxCtx(r), toe = numC("toe"), reach = numC("reach"), sit = S.a.sit, pl = n("plank");
  const mins = Number(S.a.mins || 45), N = mins <= 30 ? 5 : 6, sitTxt = sit === "c" ? "นั่งวันละ 8 ชม. ขึ้นไป" : "นั่งวันละ 4–7 ชม.";
  const C = [
    {e:it("ยืดหลังต้นขา (นอนหงายใช้ผ้าคล้องเท้า)","hamstring","ค้าง 30–45 วิ ข้างละ",`ก้มแตะเท้าได้แค่${toe === 1 ? "เข่า" : "กลางหน้าแข้ง"} หลังต้นขาตึงจะดึงเชิงกรานจนหลังงอเวลาก้ม`,null), on: toe != null && toe <= 2, t:"m"},
    {e: X.has("knee") ? it("ยืนยืดสะโพกหน้า มือจับผนัง","quadstretch","ค้าง 30–45 วิ ข้างละ","") : it("ยืดสะโพกหน้า (คุกเข่าข้างเดียว)","hipflexor","ค้าง 30–45 วิ ข้างละ",""),
     on: sit === "b" || sit === "c" || X.has("back"), t:"m", w: X.has("back") ? "สะโพกด้านหน้าที่ตึงดึงหลังล่างให้แอ่น เพิ่มแรงที่หลังส่วนที่ปวด" : `${sitTxt} สะโพกด้านหน้าจะหดสั้นและดึงหลังล่างให้แอ่น`},
    {e:it("หมุนตัวช่วงอก (นอนตะแคง)","openbook","8 ครั้ง ข้างละ",""), on: (reach != null && reach <= 2) || X.has("neck") || X.has("shoulder"), t:"m", w:"หลังส่วนบนที่แข็งทำให้ไหล่และคอต้องขยับแทน ท่านี้คืนการบิดตัวช่วงอก"},
    {e: X.has("shoulder") ? it("ยืดอกแขนต่ำ เท่าที่ไม่ปวด","doorway","ค้าง 30 วิ","") : it("ยืดอกที่ขอบประตู","doorway","ค้าง 30–45 วิ",""), on: (reach != null && reach <= 2) || sit === "c", t:"m", w:"อกด้านหน้าที่ตึงจากการนั่งหน้าจอดึงไหล่ให้ห่อ"},
    {e:it("ยืนพิงกำแพงเลื่อนแขน (Wall slide)","wallslide","10 ครั้ง",""), on: (reach != null && reach <= 2) || X.has("shoulder"), t:"c", w:`${reach != null && reach <= 2 ? "เอื้อมมือไขว้หลังไม่ถึงกัน " : ""}ฝึกยกแขนให้สุดโดยหลังไม่แอ่น และปลุกกล้ามสะบักส่วนล่าง`},
    {e:it("เก็บคางเข้า (Chin tuck)","chintuck","10 ครั้ง ค้าง 3 วิ",""), on: X.has("neck") || sit === "c", t:"c", w: X.has("neck") ? "คุณปวดคอบ่า ท่านี้ฝึกกล้ามคอส่วนลึก ลดภาระของบ่าที่ต้องเกร็งพยุงหัว" : "นั่งหน้าจอนานหัวมักยื่นไปข้างหน้า เพิ่มแรงที่คอบ่า"},
    {e:it("แมว-วัว (Cat-cow)","catcow","10 ครั้ง ช้าๆ",""), on: X.has("back") || sit === "c", t:"m", w:"ขยับกระดูกสันหลังทีละข้อ คลายความตึงจากการนั่งหรือยืนนิ่งนาน"},
    {e:it("เดดบั๊ก (Dead bug)","deadbug","8 ครั้ง ข้างละ",""), on: X.has("back") || (pl != null && pl < 45), t:"c", w: pl != null && pl < 45 ? `แพลงก์ได้ ${pl} วิ ฝึกแกนกลางให้คุมหลังนิ่งขณะแขนขาขยับ` : "ฝึกคุมหลังให้นิ่ง ลดภาระของหลังล่าง"},
    {e: X.has("wrist") ? it("นอนตะแคงยกขาด้านบน","sidelegraise","12–15 ครั้ง ข้างละ","") : it("เบิร์ดด็อก (Bird dog)","birddog","8 ครั้ง ข้างละ ค้าง 5 วิ",""), on: X.has("back"), t:"c", w:"ท่าหลักของแนวทาง McGill สำหรับคนปวดหลัง ฝึกหลังให้นิ่งขณะแขนขาขยับ"},
    {e:it("แพลงก์ด้านข้าง (วางเข่า)","sideplank","15–25 วิ ข้างละ",""), on: X.has("back") && !X.has("shoulder"), t:"c", w:"สร้างความทนทานของกล้ามข้างลำตัว ช่วยพยุงหลังล่าง"},
    {e:it("นอนตะแคงยกขาด้านบน","sidelegraise","12–15 ครั้ง ข้างละ",""), on: X.has("knee") || X.has("hip"), t:"c", w:"ก้นด้านข้างที่อ่อนทำให้เข่าบิดเข้าเวลาลงน้ำหนัก เป็นสาเหตุที่พบบ่อยของอาการปวดเข่าและสะโพก"},
    {e:it("ยกสะโพก (Glute bridge)","bridge","12–15 ครั้ง",""), on: X.has("back") || X.has("knee"), t:"c", w:"ปลุกกล้ามก้นให้รับแรงแทนหลังและเข่า"},
    {e: X.has("knee") ? it("นอนหงายไขว้ขายืดก้น","figure4","ค้าง 30–45 วิ ข้างละ","") : it("นั่งท่า 90/90 สลับสะโพก","hip9090","8 ครั้ง ข้างละ",""), on: X.has("hip") || X.has("back"), t:"m", w:"สะโพกที่หมุนได้น้อยทำให้หลังล่างและเข่าต้องบิดแทน"}
  ];
  C.forEach(x => { if(x.w) x.e.why = x.w; });
  const pref = k === "corr" ? ["c","m"] : ["m","c"];
  const seen = new Set(), list = [];
  const add = e => { if(list.length >= N || seen.has(e.n)) return; seen.add(e.n); list.push(e); };
  pref.forEach(t => C.filter(x => x.on && x.t === t).forEach(x => add(x.e)));

                            : ["แมว-วัว (Cat-cow)","หมุนตัวช่วงอก (นอนตะแคง)","ยืดสะโพกหน้า (คุกเข่าข้างเดียว)","ยืดหลังต้นขา (นอนหงายใช้ผ้าคล้องเท้า)","นั่งท่า 90/90 สลับสะโพก","ยืดอกที่ขอบประตู"];
  fill.forEach(nm => { const x = C.find(y => y.e.n === nm); if(x && !seen.has(nm)){ const e = Object.assign({}, x.e, {why:"ดูแลการเคลื่อนไหวพื้นฐานของข้อต่อนี้ ผลทดสอบส่วนนี้ของคุณยังดีอยู่"}); add(e); } });
  list.forEach(e => { e.rx += " × 2 รอบ"; });
  const note = k === "corr" ? "ทำช้าๆ เน้นรู้สึกกล้ามที่ทำงาน ไม่ปวดเพิ่มระหว่างทำ ถ้าปวดเพิ่มให้หยุดท่านั้น"
                            : "ยืดค้างแบบผ่อนคลาย หายใจยาว ตึงได้แต่ไม่เจ็บ ไม่เด้งตัว";
  return {warm:"", list, note};
}

/* วันคาร์ดิโอ: โซนชีพจรคำนวณจากอายุและชีพจรขณะพักของคนนั้น */
function cardioDay(k, r){
  const X = rxCtx(r), mins = Number(S.a.mins || 45), cs = r.dom[1].s, rhr = r.rhr, hrMax = Math.round(208 - 0.7 * X.age);
  const impactWhy = X.has("knee") || X.has("ankle") || X.has("hip") ? "คุณมีอาการปวดข้อต่อช่วงขา เลยเลือกแบบแรงกระแทกต่ำ"
                  : r.bmi && r.bmi >= 30 ? "เลือกแบบแรงกระแทกต่ำก่อน เพื่อลดแรงที่ข้อเข่าและข้อเท้า" : "";
  let zone, zoneWhy;
  if(r.parqYes){ zone = "ระดับที่พูดเป็นประโยคได้ แต่ร้องเพลงไม่ไหว"; zoneWhy = "คุณตอบว่ามีข้อในแบบคัดกรองสุขภาพ ยาบางตัวเปลี่ยนชีพจร เลยใช้การพูดเป็นตัววัดแทนตัวเลข"; }
  else {
    const low = X.easy || cs == null || cs < 50, pr = low ? [0.4, 0.55] : [0.5, 0.65], ph = low ? [0.6, 0.7] : [0.64, 0.76];
    const lvl = low ? "ใช้ความหนักปานกลางค่อนเบา" : "ใช้ความหนักปานกลาง";
    if(rhr){ zone = `ชีพจร ${Math.round(rhr + pr[0] * (hrMax - rhr))}–${Math.round(rhr + pr[1] * (hrMax - rhr))} ครั้ง/นาที`;
      zoneWhy = `${lvl} คำนวณจากชีพจรขณะพัก ${rhr} ครั้ง/นาทีของคุณ (สูตร Karvonen ${Math.round(pr[0]*100)}–${Math.round(pr[1]*100)}%)`; }

function powerDay(r){
  const X = rxCtx(r), mins = Number(S.a.mins || 45), N = mins <= 30 ? 4 : mins <= 45 ? 5 : 6, sets = X.exp >= 2 ? 3 : 2;

/* ---------- radar ---------- */
function radar(vals, labels, size){
  const cx = size/2, cy = size/2 + 4, R = size*0.32, N = vals.length;
  const pt = (i, f) => { const ang = -Math.PI/2 + i*2*Math.PI/N; return [cx + Math.cos(ang)*R*f, cy + Math.sin(ang)*R*f]; };
  let g = "";
  [0.25,0.5,0.75,1].forEach(f => { g += `<polygon points="${vals.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  vals.forEach((_,i) => { const [x,y] = pt(i,1); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  const poly = vals.map((v,i) => pt(i, Math.max(0.04,(v||0)/100)).join(",")).join(" ");
  g += `<polygon points="${poly}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i) => { const [x,y] = pt(i, Math.max(0.04,(v||0)/100)); g += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`; });
  if(labels){ labels.forEach((l,i) => { const [x,y] = pt(i,1.28); const anchor = Math.abs(x-cx) < 6 ? "middle" : x > cx ? "start" : "end";
    g += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Thai, sans-serif">${l}</text>`; }); }
  const pad = labels ? 36 : 0;
  return `<svg viewBox="${-pad} 0 ${size + pad*2} ${size+8}" role="img" aria-label="กราฟใยแมงมุมคะแนน 5 ด้าน">${g}</svg>`;
}

function copyLink(){

  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SHARE_URL).then(done, fallback); return; } }catch(e){}
  fallback();

    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(story); });

        <li>${shared ? "เลือก Instagram แล้วเลือก “สตอรี่”" : "กดค้างที่รูปด้านล่าง เลือก “บันทึกรูปภาพ” แล้วกดปุ่มเปิด IG สตอรี่ เลือกรูปการ์ด"}</li>

        <div class="row2"><button class="btn btn-ig" id="openig" type="button">เปิด IG สตอรี่</button><button class="btn" id="copylink" type="button">คัดลอกลิงก์อีกครั้ง</button></div></div>`;
    out.innerHTML = steps + (shared ? "" : `<img alt="การ์ดร่างกายของคุณ" style="width:100%;border-radius:14px;margin-top:10px" src="${cv.toDataURL("image/png")}">`);
    out.scrollIntoView({behavior:"smooth", block:"start"});
  }catch(err){
    out.innerHTML = `<p class="meta" style="margin-top:10px;text-align:center">สร้างรูปไม่สำเร็จ ลองแคปหน้าจอการ์ดแทนได้เลย</p>`;

}

  if(q.how) h += `<div class="how">${q.how}</div>`;
  if(sk){
    h += `<div class="inrow"><span class="skipped">ข้ามข้อนี้แล้ว</span><button class="skip" data-unskip="${q.id}">กลับมาทำ</button></div></div>`;
    return h;
  }
  if(q.type === "choice" || q.type === "multi"){
    const cur = a[q.id];
    if(q.timer) h += `<div class="timer" data-timer="${q.timer}" data-for="${q.id}"><span class="clock num">60</span><button class="btn btn-ghost" data-tstart>เริ่มจับเวลา 60 วิ</button></div>`;
    h += `<div class="opts ${q.one ? "one" : ""}">` + q.opts.map(([v,l]) => {
      const on = q.type === "multi" ? (cur || []).includes(v) : cur === v;
      return `<button class="opt" data-q="${q.id}" data-t="${q.type}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
    }).join("") + `</div>`;
  } else if(q.type === "num"){
    h += `<div class="inrow"><input type="number" inputmode="decimal" id="in-${q.id}" data-in="${q.id}" min="${q.min}" max="${q.max}" value="${nn(a[q.id], "")}">${q.units ? `<span class="seg" role="group" aria-label="หน่วย"><button data-unit="cm" aria-pressed="${unitOf(q.id)==="cm"}">ซม.</button><button data-unit="in" aria-pressed="${unitOf(q.id)==="in"}">นิ้ว</button></span>` : `<span class="unit">${q.unit}</span>`}</div>`;
    if(q.timer) h += `<div class="timer" data-timer="${q.timer}" data-for="${q.id}"><span class="clock num">${q.timer === "down60" ? "60" : "0"}</span><button class="btn btn-ghost" data-tstart>${q.timer === "down60" ? "เริ่มจับเวลา 60 วิ" : "เริ่มจับเวลา"}</button></div>`;
  } else if(q.type === "text"){
    h += `<input type="text" id="in-${q.id}" data-in="${q.id}" placeholder="${q.ph||""}" value="${esc(nn(a[q.id], ""))}" maxlength="30">`;
  }
  if(q.skip) h += `<button class="skip" data-skip="${q.id}">ข้ามข้อนี้</button>`;
  return h + `</div>`;
}

function viewStep(){
  const st = STEPS[S.step];
  const lanes = STEPS.map((_,i) => `<div class="lane ${i <= S.step ? "on" : ""}"></div>`).join("");
  let warn = "";
  if(st.id === "test" && compute().parqYes)
    warn = `<div class="alert">คุณตอบว่ามีข้อที่ตรงในหัวข้อเช็กความพร้อม แนะนำให้ข้ามการทดสอบวิดพื้น แพลงก์ และย่ำเท้ายกเข่า แล้วปรึกษาแพทย์ก่อนเริ่มออกกำลังกายที่หนักขึ้น ถ้าทดสอบแล้วรู้สึกเจ็บหน้าอก เวียนหัว หรือหายใจไม่ทัน ให้หยุดทันที</div>`;
  return `
  <div>
    <div class="lanes" aria-hidden="true">${lanes}</div>
    <div class="lane-label"><span>ขั้นที่ ${S.step+1} จาก ${STEPS.length}</span><span>${st.title}</span></div>
  </div>
  <section class="card">
    <h2>${st.title}</h2>
    <p class="sub">${st.sub}</p>
    ${warn ? `<div style="margin-top:14px">${warn}</div>` : ""}
    <div style="margin-top:10px">${st.qs.map(qHTML).join("")}</div>
    <p class="err" id="err" role="alert">${S.err}</p>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-ghost" id="back">ย้อนกลับ</button>
      <button class="btn btn-primary" id="next">${S.step === STEPS.length-1 ? "ดูผลประเมิน" : "ถัดไป"}</button>
    </div>
  </section>`;
}

function validate(){
  const st = STEPS[S.step], a = S.a;
  for(const q0 of st.qs){
    const q = rng(q0);
    if(q.optional || S.skipped[q.id]) continue;
    if(q.type === "yesno"){ const v = a.parq || []; if(q.items.some((_,i) => !v[i])) return "ตอบหัวข้อความปลอดภัยให้ครบทุกข้อก่อนนะครับ"; continue; }
    const v = a[q.id];
    if(q.type === "multi"){ if(!v || !v.length) return `เลือกคำตอบข้อ “${q.label}” ก่อนนะครับ`; continue; }
    if(q.skip && (v === undefined || v === "")) return `กรอกข้อ “${q.label}” หรือกด “ข้ามข้อนี้” ก่อนนะครับ`;
    if(v === undefined || v === "") return `กรอกข้อ “${q.label}” ก่อนนะครับ`;
    if(q.type === "num"){ const x = Number(v); if(isNaN(x) || x < q.min || x > q.max) return `ค่าข้อ “${q.label}” ควรอยู่ระหว่าง ${q.min}–${q.max} ${q.unit}`; }
  }
  if(st.id === "test" && n("push") != null && !c("pushStyle")) return "เลือกแบบวิดพื้นที่ทำ เพื่อให้คิดคะแนนได้ถูกต้อง";
  // optional fields still need sane values
  for(const q0 of st.qs){ const q = rng(q0); if(q.type === "num" && q.optional && a[q.id] !== undefined && a[q.id] !== ""){ const x = Number(a[q.id]); if(isNaN(x) || x < q.min || x > q.max) return `ค่าข้อ “${q.label}” ควรอยู่ระหว่าง ${q.min}–${q.max} ${q.unit}`; } }
  return "";
}

function ageSection(r){
  const rows = [];
  const row = (title, val, lv, col, group, extra, bar) => `<div class="cmp">
      <div class="cmp-top"><b>${title}</b><span class="pill" style="color:${col}">${lv}</span></div>
      <div class="cmp-val"><span class="num">${val}</span> <span class="sub" style="margin:0">เทียบกับ${group}</span></div>
      ${bar || ""}${extra ? `<div class="meta">${extra}</div>` : ""}</div>`;
  const colFor = q => q >= 3 ? "var(--good)" : q >= 2 ? "var(--warn)" : "var(--bad)";
  if(r.sqN){ const x = r.sqN;
    const bar = `<div class="pbar" aria-hidden="true"><i style="left:${x.pct}%"></i><span style="left:25%"></span><span style="left:50%"></span><span style="left:75%"></span></div>`;
    rows.push(row("ลุกนั่งเก้าอี้ 1 นาที", `${r.sq} ครั้ง`, x.lv, colFor(x.pct >= 75 ? 4 : x.pct >= 50 ? 3 : x.pct >= 25 ? 2 : 1), x.group,
      `ทำได้มากกว่าประมาณ <b>${x.pct}%</b> ของคนกลุ่มนี้ · ค่ากลาง ${x.med} ครั้ง${x.next ? ` · ${x.next.t} ต้องทำ ${x.next.n} ครั้ง` : ""}`, bar)); }
  if(r.pushN){ const x = r.pushN, styleTh = {full:"เต็มตัว", knee:"วางเข่า"}[c("pushStyle")];
    rows.push(row(`วิดพื้น (${styleTh})`, `${n("push")} ครั้ง`, x.lv, colFor(x.i >= 3 ? 4 : x.i >= 2 ? 3 : x.i >= 1 ? 2 : 1), x.group,
      [x.next ? `${x.next.t} ต้องทำ ${x.next.n} ครั้ง` : "อยู่ระดับสูงสุดของเกณฑ์แล้ว", x.note].filter(Boolean).join(" · "))); }
  else if(n("push") != null && c("pushStyle")) rows.push(`<div class="cmp"><div class="cmp-top"><b>วิดพื้น</b></div><div class="meta">เกณฑ์ตามอายุใช้กับ${S.a.sex === "f" ? "วิดพื้นวางเข่าหรือเต็มตัว" : "วิดพื้นเต็มตัว"} ข้อนี้จึงคิดคะแนนแบบทั่วไปแทน</div></div>`);
  if(r.rhrN){ const x = r.rhrN;
    const warn = r.rhr > 100 ? " · ชีพจรขณะพักเกิน 100 ควรวัดซ้ำ ถ้ายังสูงอยู่ควรปรึกษาแพทย์" : "";
    rows.push(row("ชีพจรขณะพัก", `${r.rhr} ครั้ง/นาที`, x.lv, colFor(x.i <= 2 ? 4 : x.i <= 4 ? 3 : x.i === 5 ? 2 : 1), x.group,
      (x.next ? `${x.next.t} ต้องไม่เกิน ${x.next.n} ครั้ง/นาที` : "อยู่ในระดับดีแล้ว") + warn)); }
  if(!rows.length) return "";
  return `<section class="card">
    <h2>เทียบกับคนวัยเดียวกัน</h2>
    <p class="sub">ดูว่าแต่ละข้อแข็งแรงระดับไหน เมื่อเทียบกับคนเพศและช่วงอายุเดียวกัน</p>
    <div class="cmps">${rows.join("")}</div>
    <p class="meta" style="margin-top:12px">ข้อแพลงก์ ก้มแตะเท้า เอื้อมมือไขว้หลัง และย่ำเท้า ยังไม่มีเกณฑ์แยกตามอายุที่เป็นมาตรฐาน จึงใช้เกณฑ์ทั่วไป · เกณฑ์อ้างอิง: ลุกนั่ง 1 นาที จาก Strassmann และคณะ 2013 (ผู้ใหญ่ในสวิตเซอร์แลนด์ 6,926 คน), วิดพื้นจากสมาคมสรีรวิทยาการออกกำลังกายแคนาดา (CSEP), ชีพจรขณะพักจากตารางอ้างอิงที่ใช้ทั่วไป ทั้งหมดเป็นข้อมูลต่างประเทศ ใช้เทียบคร่าวๆ</p>
  </section>`;
}

/* ---------- ตารางอันดับ ---------- */
const BAND_LABEL = {u20:"ต่ำกว่า 20 ปี", "20":"20–29 ปี", "30":"30–39 ปี", "40":"40–49 ปี", "50":"50–59 ปี", "60":"60 ปีขึ้นไป"};
function bandOf(age){ return age < 20 ? "u20" : String(Math.min(60, Math.floor(age/10)*10)); }
function deviceId(){
  try{ let id = localStorage.getItem("fuji-id"); if(!id){ id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("fuji-id", id); } return id; }
  catch(e){ if(!window.__fid) window.__fid = Math.random().toString(36).slice(2) + Date.now().toString(36); return window.__fid; }
}
let LB = {state:"idle", data:null, sex:null, band:null, msg:""};
function lbEligible(r){ return r.dom[0].s != null && r.dom[1].s != null && r.dom[2].s != null; }
// คะแนนในตารางอันดับ: ด้านที่ไม่ได้ทดสอบนับเป็น 0 เพื่อความยุติธรรม
function lbScore(r){ return Math.round(r.dom.reduce((t,d) => t + (d.s || 0), 0) / r.dom.length); }
// ตารางอันดับทำงานเฉพาะหน้าที่เปิดผ่านลิงก์ Google (QR) เท่านั้น
const LB_HOST_OK = (() => { try { return !/claude/i.test(location.hostname); } catch(e){ return true; } })();
function lbSection(r, ar){
  if(!LEADERBOARD_URL) return "";
  if(!LB_HOST_OK) return `<section class="card" id="lb"><h2>ตารางอันดับ</h2><p class="sub">ตารางอันดับใช้ได้เมื่อเปิดผ่าน QR หรือลิงก์ของโค้ชฟูจิเท่านั้น หน้านี้เป็นฉบับตัวอย่าง จึงไม่ส่งคะแนนเข้าอันดับ</p></section>`;
  const mySex = S.a.sex === "f" ? "f" : "m", myBand = bandOf(n("age") || 30);
  if(!LB.sex){ LB.sex = mySex; LB.band = myBand; }
  const grp = `${LB.sex === "f" ? "ผู้หญิง" : "ผู้ชาย"} ${BAND_LABEL[LB.band]}`;
  let form = "";
  const missing = r.dom.slice(0,3).filter(d => d.s == null).map(d => d.name);
  form = `<div class="lb-form">
      <div class="meta">ส่งคะแนน <b>${lbScore(r)}</b> เข้าอันดับให้อัตโนมัติแล้ว ในชื่อ <b>${esc(lbName())}</b> · ขึ้นแค่ชื่อ คะแนนรวม และฉายาร่างกาย ไม่แสดงอายุ น้ำหนัก หรือข้อมูลสุขภาพ</div>
      ${missing.length ? `<div class="alert">ด้านที่ไม่ได้ทดสอบ (${missing.join(", ")}) นับเป็น 0 ในตารางอันดับ คะแนนอันดับเลยต่ำกว่าคะแนนในหน้านี้ กด “แก้คำตอบ” แล้วกลับไปทำท่าที่ข้ามไว้ อันดับจะขยับขึ้นเอง</div>` : ""}
      <div class="inrow"><input type="text" id="lb-name" maxlength="20" value="${esc(S.lbName || S.a.name || "")}" placeholder="${esc(lbAlias())}" aria-label="ชื่อที่แสดงในอันดับ"><button class="btn btn-ghost" id="lb-send" style="min-height:46px">เปลี่ยนชื่อ</button></div>
    </div>`;
  let board = "";
  if(LB.state === "loading") board = `<p class="meta">กำลังโหลดอันดับ…</p>`;
  else if(LB.state === "error") board = `<div class="alert">${LB.msg || "โหลดอันดับไม่สำเร็จ"} <button class="skip" id="lb-retry">ลองใหม่</button></div>`;
  else if(LB.state === "ok" && LB.data){
    const d = LB.data;
    const me = d.me && LB.sex === mySex && LB.band === myBand ? `<div class="lb-me">คุณอยู่อันดับ <b class="num">${d.me.rank}</b> จาก <span class="num">${d.total}</span> คน</div>` : "";
    board = me + (d.top.length ? `<ol class="lb-list">${d.top.map(t => `<li class="${t.me ? "me" : ""}"><span class="rk num">${t.rank}</span><span class="nm">${esc(t.name)}<small>${esc(t.type || "")}</small></span><span class="sc num">${t.score}</span></li>`).join("")}</ol>`
      : `<p class="meta">ยังไม่มีใครในกลุ่มนี้ เป็นคนแรกเลย</p>`);
  }
  const sel = (id, opts, cur) => `<select id="${id}" class="lb-sel">${opts.map(([v,l]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  return `<section class="card" id="lb">
    <h2>ตารางอันดับ</h2>
    <p class="sub">จัดอันดับจากคะแนนรวม แยกตามเพศและช่วงอายุ</p>
    ${form ? `<div style="margin-top:14px">${form}</div>` : ""}
    <div class="lb-head">
      <span class="ql">Top 10 · ${grp}</span>
      <span class="lb-pick">${sel("lb-sex", [["m","ผู้ชาย"],["f","ผู้หญิง"]], LB.sex)}${sel("lb-band", Object.entries(BAND_LABEL), LB.band)}</span>
    </div>
    ${board}
  </section>`;
}
function lbFetch(opts){
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 12000);
  return fetch(opts.url, Object.assign({signal: ctl ? ctl.signal : undefined}, opts.init || {}))
    .then(res => { if(!res.ok) throw new Error("http " + res.status); return res.json(); })
    .finally(() => clearTimeout(timer));
}
function logCompletion(){
  // บันทึกสถิติแบบไม่ระบุตัวตน 1 ครั้งต่อชุดคำตอบ
  if(!LEADERBOARD_URL) return;
  const sig = JSON.stringify([S.a, S.skipped]);
  if(S.loggedSig === sig) return;
  const r = compute(); if(r.overall == null) return;
  const body = {kind:"log", id: deviceId(), sex: S.a.sex === "f" ? "f" : "m", band: bandOf(n("age") || 30), goal: S.a.goal || "", score: r.overall, type: archetype(r).t};
  lbFetch({url: LEADERBOARD_URL, init: {method: "POST", body: JSON.stringify(body)}})
    .then(d => { if(d && d.ok){ S.loggedSig = sig; save(); } })
    .catch(() => {});
}
function lbRender(){ const el = $("#lb"); if(!el) return; const r = compute(); const tmp = document.createElement("div"); tmp.innerHTML = lbSection(r, archetype(r)); el.replaceWith(tmp.firstElementChild); }
function lbLoad(){
  if(!LEADERBOARD_URL) return;
  LB.state = "loading"; lbRender();
  const q = `?sex=${encodeURIComponent(LB.sex)}&band=${encodeURIComponent(LB.band)}&id=${encodeURIComponent(deviceId())}`;
  lbFetch({url: LEADERBOARD_URL + q})
    .then(d => { if(d.error) throw new Error(d.error); LB.state = "ok"; LB.data = d; lbRender(); })
    .catch(() => { LB.state = "error"; LB.msg = "โหลดอันดับไม่สำเร็จ ตรวจสัญญาณเน็ตแล้วลองใหม่"; lbRender(); });
}
function lbAlias(){ return "ผู้เล่น #" + deviceId().slice(-4).toUpperCase(); }
function lbName(){ return (S.lbName || S.a.name || "").trim() || lbAlias(); }
function lbSend(rename){
  if(rename){ const v = ($("#lb-name").value || "").trim(); S.lbName = v; }
  const r = compute(), ar = archetype(r);
  if(r.overall == null) return;
  const body = {id: deviceId(), name: lbName(), sex: S.a.sex === "f" ? "f" : "m", band: bandOf(n("age") || 30), score: lbScore(r), type: ar.t};
  const sig = JSON.stringify(body);
  LB.sex = body.sex; LB.band = body.band; LB.state = "loading"; lbRender();
  lbFetch({url: LEADERBOARD_URL, init: {method: "POST", body: JSON.stringify(body)}})
    .then(d => { if(d.error) throw new Error(d.error); S.lbDone = true; S.lbSig = sig; save(); LB.state = "ok"; LB.data = d; lbRender(); })
    .catch(() => { LB.state = "error"; LB.msg = "ส่งคะแนนเข้าอันดับไม่สำเร็จ ตรวจสัญญาณเน็ตแล้วกดลองใหม่"; lbRender(); });
}
function lbAuto(){
  const r = compute(); if(r.overall == null) return false;
  const sig = JSON.stringify({id: deviceId(), name: lbName(), sex: S.a.sex === "f" ? "f" : "m", band: bandOf(n("age") || 30), score: lbScore(r), type: archetype(r).t});
  if(S.lbSig === sig) return false;
  lbSend(false); return true;
}

function summaryText(r, ar){
  const nm = S.a.name ? S.a.name : "ผู้ทำแบบประเมิน";
  const goalL = (STEPS[1].qs[0].opts.find(o => o[0] === S.a.goal) || [0, "-"])[1];
  const lines = [`ผลเช็กร่างกาย 5 นาที: ${nm}`, `เพศ ${S.a.sex === "f" ? "หญิง" : "ชาย"} อายุ ${S.a.age} ปี`, `เป้าหมาย: ${goalL}`,
    `คะแนนรวม: ${nn(r.overall, "-")} / 100 (${levelOf(r.overall).t})`, `ร่างกายสาย: ${ar.t}`];
  r.dom.forEach(d => lines.push(`- ${d.name}: ${nn(d.s, "ไม่ได้ทดสอบ")}`));
  if(r.sqN) lines.push(`ลุกนั่ง 1 นาที ${r.sq} ครั้ง: ${r.sqN.lv} (มากกว่า ~${r.sqN.pct}% ของ${r.sqN.group})`);
  if(r.pushN) lines.push(`วิดพื้น ${n("push")} ครั้ง: ${r.pushN.lv} (${r.pushN.group})`);
  if(r.rhrN) lines.push(`ชีพจรขณะพัก ${r.rhr}: ${r.rhrN.lv} (${r.rhrN.group})`);
  if(r.bmi) lines.push(`BMI ${r.bmi.toFixed(1)}${r.whr ? ` · รอบเอว/ส่วนสูง ${r.whr.toFixed(2)}` : ""}`);
  if(r.pain.length) lines.push(`จุดที่ปวดหรือตึง: ${r.pain.map(p => STEPS[3].qs[1].opts.find(o => o[0] === p)[1]).join(", ")}`);
  if(r.parqYes) lines.push(`เช็กความพร้อม: มีข้อที่ตรงอย่างน้อย 1 ข้อ`);
  lines.push(`ว่าง ${S.a.days === "5" ? "5+" : S.a.days} วัน/สัปดาห์ ครั้งละ ${S.a.mins} นาที`);
  lines.push(`ส่งให้${COACH.name} · LINE: ${COACH.line} · IG: ${COACH.ig}`);
  return lines.join("\n");
}

function viewResult(){
  const r = compute(), ar = archetype(r), lv = levelOf(r.overall), pl = plan(r), wk = pl.days, ms = missions(), helps = coachHelps(r);
  const nm = S.a.name ? esc(S.a.name) : "คุณ";

    SFX.tap(); const id = t.dataset.q, v = t.dataset.v;
    if(t.dataset.t === "multi"){
      let cur = (S.a[id] || []).slice();
      if(v === "none") cur = cur.includes("none") ? [] : ["none"];
      else { cur = cur.filter(x => x !== "none"); cur = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v); }
      S.a[id] = cur;
      t.parentElement.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", cur.includes(b.dataset.v)));
    } else {
      S.a[id] = v;
      t.parentElement.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b === t));
    }
    save(); return;
  }
  if(t.dataset.unit){ SFX.tap(); const inp = t.closest(".inrow").querySelector("input"); const id = inp.dataset.in; const old = unitOf(id), nu = t.dataset.unit;
    if(old !== nu){ const v = Number(S.a[id]); if(S.a[id] !== undefined && S.a[id] !== "" && !isNaN(v)){ S.a[id] = String(Math.round((nu === "in" ? v/2.54 : v*2.54)*10)/10); } S.a[id+"Unit"] = nu; render(); }
    return; }
  if(t.dataset.skip){ SFX.skip(); S.skipped[t.dataset.skip] = true; delete S.a[t.dataset.skip]; S.err = ""; return render(); }
  if(t.dataset.unskip){ delete S.skipped[t.dataset.unskip]; return render(); }
  if(t.hasAttribute("data-tstart")){
    const box = t.closest(".timer"), clock = box.querySelector(".clock"), mode = box.dataset.timer, target = box.dataset.for;
    if(tick){ clearInterval(tick); tick = null; SFX.stop();
      if(mode === "up"){ const sec = Number(clock.textContent); S.a[target] = String(sec); const inp = $("#in-" + target); if(inp) inp.value = sec; save(); }
      box.classList.remove("running"); t.textContent = mode === "down60" ? "เริ่มจับเวลา 60 วิ" : "เริ่มจับเวลา"; return; }
    const t0 = Date.now(); let lastSec = -1; SFX.start(); box.classList.add("running"); box.scrollIntoView({block:"center", behavior:"smooth"});
    t.textContent = mode === "down60" ? "หยุด" : "หยุดและบันทึกเวลา";
    tick = setInterval(() => {
      const el = Math.floor((Date.now() - t0) / 1000);
      const fresh = el !== lastSec; lastSec = el;
      if(mode === "down60"){ const left = Math.max(0, 60 - el); clock.textContent = left;
        if(fresh && left > 0){ if(left <= 3) SFX.count(); else if(left <= 10 || left === 30) SFX.tick(); }
        if(left === 0){ clearInterval(tick); tick = null; SFX.end(); clock.textContent = "หมดเวลา"; t.textContent = "จับเวลาอีกครั้ง"; box.classList.remove("running"); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} const inp = $("#in-" + target); if(inp) inp.focus(); } }
      else { clock.textContent = el; if(fresh && el > 0 && el % 15 === 0) SFX.lap(); }
    }, 250);
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "lb-sex" || e.target.id === "lb-band"){ LB.sex = $("#lb-sex").value; LB.band = $("#lb-band").value; SFX.tap(); lbLoad(); }
});
document.addEventListener("input", e => {
  const id = e.target.dataset && e.target.dataset.in; if(!id) return;
  S.a[id] = e.target.value; save();
});

function fixState(){
  if(!S.a || typeof S.a !== "object") S.a = {};
  if(!S.skipped || typeof S.skipped !== "object") S.skipped = {};
  const p = S.a.pain; if(p != null && !Array.isArray(p)) S.a.pain = [String(p)];
  if(S.a.goal && !["fat","muscle","health","pain","sport"].includes(S.a.goal)) delete S.a.goal;
  if(!(S.step >= 0 && S.step < STEPS.length)) S.step = 0;
}
function start(data){
  if(data && data.a) S = Object.assign(S, data); else load();
  fixState();
  if(S.view === "result" && !S.a.goal) S.view = "start";
  render(); syncSoundBtn();
}
var HOT = window.claude && window.claude.hot;
if(HOT && HOT.snapshot) HOT.snapshot(() => S);
if(HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});
</script>
